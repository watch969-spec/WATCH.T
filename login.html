<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Login | WATCH.T</title>
  <meta name="description" content="Sign in to your WATCH.T account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* ---------- LOGIN PAGE ---------- */
    .auth-page {
      min-height: calc(100vh - 74px);
      background: var(--paper);
      display: grid;
      place-items: center;
      padding: 60px 24px;
    }

    .auth-box {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border: 1px solid var(--line);
      padding: 48px 40px;
      box-shadow: 0 24px 70px rgba(0,0,0,.08);
    }

    .auth-icon {
      text-align: center;
      font-size: 32px;
      margin-bottom: 16px;
      color: var(--gold);
    }

    .auth-box h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 34px;
      font-weight: 500;
      text-align: center;
      margin: 0 0 8px;
      color: var(--ink);
      line-height: 1.15;
    }
    .auth-box h1 span { color: var(--gold); font-style: italic; font-weight: 400; }

    .auth-subtitle {
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      margin: 0 0 32px;
      font-weight: 300;
      line-height: 1.6;
    }

    /* Tabs */
    .auth-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      background: var(--paper);
      padding: 4px;
      border: 1px solid var(--line);
    }
    .auth-tab {
      flex: 1;
      padding: 12px 8px;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: all .3s var(--ease);
    }
    .auth-tab:hover { color: var(--ink); }
    .auth-tab.active {
      background: var(--ink);
      color: var(--white);
    }

    /* Fields */
    .auth-field { margin-bottom: 18px; }
    .auth-field label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .auth-field input {
      width: 100%;
      padding: 15px 16px;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: all .3s var(--ease);
    }
    .auth-field input:focus {
      border-color: var(--gold);
      background: var(--white);
    }
    .auth-field input::placeholder {
      color: var(--muted);
      font-weight: 300;
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 70px; }
    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gold);
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px;
    }
    .show-password:hover { color: var(--ink); }

    /* Options */
    .auth-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 4px 0 24px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .remember input {
      width: auto;
      accent-color: var(--gold);
      cursor: pointer;
    }
    .forgot {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      transition: color .3s var(--ease);
    }
    .forgot:hover { color: var(--ink); text-decoration: underline; }

    /* Submit */
    .auth-submit {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--ink);
      border: 1px solid var(--gold);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .4s var(--ease);
    }
    .auth-submit:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--gold);
    }
    .auth-submit:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* Message */
    .auth-message {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.6;
      border-left: 3px solid var(--gold);
      background: var(--paper);
      color: var(--ink);
      font-weight: 400;
    }
    .auth-message.error {
      border-left-color: #c62828;
      background: #ffebee;
      color: #b71c1c;
    }
    .auth-message.success {
      border-left-color: #2e7d32;
      background: #e8f5e9;
      color: #1b5e20;
    }

    /* Guest link */
    .auth-guest {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }
    .auth-guest a {
      color: var(--gold);
      font-weight: 600;
      text-decoration: none;
      transition: color .3s var(--ease);
    }
    .auth-guest a:hover { color: var(--ink); text-decoration: underline; }

    /* Terms */
    .auth-terms {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
      margin-top: 20px;
      font-weight: 300;
    }
    .auth-terms a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
    }
    .auth-terms a:hover { text-decoration: underline; }

    /* Header override */
    .header .logo,
    .header a { color: #fff; }
    .header a:hover { color: var(--gold); }
    .auth-back-link {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,.75);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color .3s var(--ease);
    }
    .auth-back-link:hover { color: var(--gold); }

    /* Responsive */
    @media (max-width: 500px) {
      .auth-page { padding: 40px 16px; }
      .auth-box { padding: 36px 24px; }
      .auth-box h1 { font-size: 28px; }
      .auth-subtitle { font-size: 13px; margin-bottom: 24px; }
      .auth-field { margin-bottom: 16px; }
      .auth-field input { padding: 14px; font-size: 14px; }
      .auth-options { font-size: 11px; }
    }
  </style>
</head>
<body>

<header class="header">
  <a class="logo" href="index.html">WATCH<span>.T</span></a>
  <a class="auth-back-link" href="index.html">← Back to Shop</a>
</header>

<main class="auth-page">
  <section class="auth-box">

    <div class="auth-icon">⌚</div>
    <h1 id="heading">Welcome <span>Back</span></h1>
    <p class="auth-subtitle" id="subtitle">Sign in to your WATCH.T account</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" type="button">Login</button>
      <button class="auth-tab" id="signupTab" type="button">Create Account</button>
    </div>

    <!-- Form -->
    <form id="authForm" novalidate>

      <div class="auth-field" id="nameField" hidden>
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
          autocomplete="name">
      </div>

      <div class="auth-field">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required>
      </div>

      <div class="auth-field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password (min 6 characters)"
            minlength="6"
            autocomplete="current-password"
            required>
          <button class="show-password" type="button" id="togglePassword">Show</button>
        </div>
      </div>

      <div class="auth-field" id="confirmField" hidden>
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter password"
          minlength="6"
          autocomplete="new-password">
      </div>

      <div class="auth-options" id="loginOptions">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>
        <a href="#" class="forgot" id="forgotLink">Forgot password?</a>
      </div>

      <button class="auth-submit" type="submit" id="submitBtn">Login</button>

      <div class="auth-message" id="message" role="status" aria-live="polite"></div>

    </form>

    <!-- Guest -->
    <div class="auth-guest">
      Just browsing? <a href="index.html#products">Continue as Guest →</a>
    </div>

    <!-- Terms -->
    <p class="auth-terms">
      By continuing, you agree to our
      <a href="privacy-policy.html">Privacy Policy</a> and
      <a href="return-policy.html">Return Policy</a>.
    </p>

  </section>
</main>

<script type="module">
  import { supabase, supabaseConfigured } from "./supabase.js";

  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");
  const heading = document.getElementById("heading");
  const subtitle = document.getElementById("subtitle");
  const nameField = document.getElementById("nameField");
  const confirmField = document.getElementById("confirmField");
  const loginOptions = document.getElementById("loginOptions");
  const submitBtn = document.getElementById("submitBtn");
  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirmPassword");
  const fullName = document.getElementById("fullName");
  const message = document.getElementById("message");
  const authForm = document.getElementById("authForm");
  const togglePassword = document.getElementById("togglePassword");
  const forgotLink = document.getElementById("forgotLink");

  let mode = "login";
  let messageTimer = null;

  function showMessage(text, kind = "info") {
    clearTimeout(messageTimer);
    message.textContent = text;
    message.className = "auth-message " + (kind === "error" ? "error" : kind === "success" ? "success" : "");
    message.style.display = "block";

    // Auto-hide success messages after 5s
    if (kind === "success") {
      messageTimer = setTimeout(() => {
        message.style.display = "none";
      }, 5000);
    }
  }

  function hideMessage() {
    message.style.display = "none";
    message.textContent = "";
  }

  function setMode(next) {
    mode = next;
    const signup = mode === "signup";

    loginTab.classList.toggle("active", !signup);
    signupTab.classList.toggle("active", signup);
    nameField.hidden = !signup;
    confirmField.hidden = !signup;
    loginOptions.hidden = signup;

    fullName.required = signup;
    confirmPassword.required = signup;
    password.autocomplete = signup ? "new-password" : "current-password";

    heading.innerHTML = signup
      ? 'Create <span>Account</span>'
      : 'Welcome <span>Back</span>';

    subtitle.textContent = signup
      ? "Join the WATCH.T family — it only takes a minute"
      : "Sign in to your WATCH.T account";

    submitBtn.textContent = signup ? "Create Account" : "Login";
    hideMessage();

    // Reset password visibility
    password.type = "password";
    togglePassword.textContent = "Show";
  }

  loginTab.addEventListener("click", () => setMode("login"));
  signupTab.addEventListener("click", () => setMode("signup"));

  togglePassword.addEventListener("click", function () {
    const hidden = password.type === "password";
    password.type = hidden ? "text" : "password";
    this.textContent = hidden ? "Hide" : "Show";
  });

  forgotLink.addEventListener("click", async (e) => {
    e.preventDefault();

    if (!supabaseConfigured) {
      showMessage("Supabase is not configured. Please check supabase.js.", "error");
      return;
    }

    const email = document.getElementById("email").value.trim();
    if (!email) {
      showMessage("Please enter your email address first.", "error");
      return;
    }

    forgotLink.style.pointerEvents = "none";
    forgotLink.style.opacity = ".6";
    showMessage("Sending reset link...", "info");

    try {
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + "/login.html"
      });

      if (error) throw error;
      showMessage(
        "Password reset link sent! Please check your email inbox (and spam folder).",
        "success"
      );
    } catch (err) {
      showMessage(err.message || "Failed to send reset link. Please try again.", "error");
    } finally {
      forgotLink.style.pointerEvents = "";
      forgotLink.style.opacity = "1";
    }
  });

  authForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!supabaseConfigured) {
      showMessage("Supabase is not configured. Please check supabase.js.", "error");
      return;
    }

    const email = document.getElementById("email").value.trim();

    if (!email) {
      showMessage("Please enter your email address.", "error");
      return;
    }

    if (!password.value || password.value.length < 6) {
      showMessage("Password must be at least 6 characters.", "error");
      return;
    }

    if (mode === "signup" && password.value !== confirmPassword.value) {
      showMessage("Passwords do not match. Please try again.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Please wait...";
    hideMessage();

    try {
      if (mode === "signup") {
        const { data, error } = await supabase.auth.signUp({
          email,
          password: password.value,
          options: {
            data: { full_name: fullName.value.trim() }
          }
        });

        if (error) throw error;

        if (data.session) {
          showMessage("Account created! Signing you in...", "success");
          setTimeout(() => {
            location.href = "my-orders.html";
          }, 1000);
        } else {
          showMessage(
            "Account created! Please check your email to verify your account before signing in.",
            "success"
          );
        }
      } else {
        const { error } = await supabase.auth.signInWithPassword({
          email,
          password: password.value
        });

        if (error) throw error;

        showMessage("Login successful! Redirecting...", "success");
        setTimeout(() => {
          location.href = "my-orders.html";
        }, 700);
      }
    } catch (err) {
      let errorMsg = err.message || "Something went wrong. Please try again.";

      // Friendlier error messages
      if (errorMsg.includes("Invalid login credentials")) {
        errorMsg = "Incorrect email or password. Please try again.";
      } else if (errorMsg.includes("Email not confirmed")) {
        errorMsg = "Please verify your email first. Check your inbox for the confirmation link.";
      } else if (errorMsg.includes("already registered")) {
        errorMsg = "This email is already registered. Try logging in instead.";
      } else if (errorMsg.includes("Password should be")) {
        errorMsg = "Password is too weak. Please use at least 6 characters.";
      }

      showMessage(errorMsg, "error");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = mode === "signup" ? "Create Account" : "Login";
    }
  });

  // If user is already logged in, redirect to my-orders
  if (supabaseConfigured) {
    try {
      const { data } = await supabase.auth.getSession();
      if (data?.session) {
        location.href = "my-orders.html";
      }
    } catch (err) {
      console.error("Session check failed:", err);
    }
  }
</script>

</body>
</html>
